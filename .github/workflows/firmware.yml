name: Build and Publish Firmware

on:
  push:
    branches: [ main ]
    paths:
      - "CMakeLists.txt"
      - "main/**"
      - "partitions.csv"
      - "sdkconfig.defaults"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Wi-Fi secrets header
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASS: ${{ secrets.WIFI_PASS }}
        run: |
          cat > main/secrets.h <<EOF
          #pragma once
          #define WIFI_SSID "${WIFI_SSID:-CHANGE_ME}"
          #define WIFI_PASS "${WIFI_PASS:-CHANGE_ME}"
          EOF

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32c6
          idf.py build

      - name: Prepare OTA files
        id: ota
        shell: bash
        run: |
          mkdir -p ota
          cp build/xauusd_chart.bin ota/xauusd_chart.bin
          cp build/bootloader/bootloader.bin ota/bootloader.bin
          cp build/partition_table/partition-table.bin ota/partition-table.bin

          COMMIT="${GITHUB_SHA::7}"
          VERSION="build-${GITHUB_RUN_NUMBER}-${COMMIT}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          SHA256="$(sha256sum ota/xauusd_chart.bin | awk '{print $1}')"
          SIZE="$(stat -c%s ota/xauusd_chart.bin)"
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/xauusd_chart.bin"

          cat > ota/version.json <<EOF
          {
            "name": "xauusd_chart",
            "version": "$VERSION",
            "commit": "$COMMIT",
            "build_date": "$BUILD_DATE",
            "target": "esp32c6",
            "idf": "v5.4.2",
            "firmware": {
              "file": "xauusd_chart.bin",
              "size": $SIZE,
              "sha256": "$SHA256",
              "url": "$URL"
            }
          }
          EOF

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-chart-${{ steps.ota.outputs.version }}
          path: ota/

      - name: Publish to GitHub Pages branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/gh-pages origin/gh-pages
          else
            git worktree add --detach /tmp/gh-pages
            git -C /tmp/gh-pages checkout --orphan gh-pages
            git -C /tmp/gh-pages rm -rf . || true
          fi

          cp ota/* /tmp/gh-pages/
          git -C /tmp/gh-pages add xauusd_chart.bin bootloader.bin partition-table.bin version.json
          git -C /tmp/gh-pages commit -m "Update firmware ${{ steps.ota.outputs.version }} [skip ci]" || echo "No firmware changes"
          git -C /tmp/gh-pages push origin HEAD:gh-pages

      - name: Print OTA URL
        run: |
          echo "${{ steps.ota.outputs.url }}"
